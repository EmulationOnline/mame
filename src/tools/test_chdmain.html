<!DOCTYPE html>
<html>
<head>
    <title>CHDMain Test</title>
</head>
<body>
    <h1>CHDMain Version Test</h1>
    <div>
        <label for="folderInput">Upload Folder:</label>
        <input type="file" id="folderInput" webkitdirectory directory multiple>
    </div>
    <br>
    <textarea id="log" rows="20" cols="100"></textarea>
    <script>
        var logElement = document.getElementById('log');
        function log(text) {
            logElement.value += text + "\n";
            logElement.scrollTop = logElement.scrollHeight;
            console.log(text);
        }

        document.getElementById('folderInput').addEventListener('change', async function(e) {
            var files = e.target.files;
            log("Folder uploaded. Found " + files.length + " files.");
            for (var i = 0; i < files.length; i++) {
                log("File: " + (files[i].webkitRelativePath || files[i].name));
            }

            if (files.length > 0) {
                var file = files[0];
                log("Computing SHA-256 for first file: " + (file.webkitRelativePath || file.name));
                try {
                    var arrayBuffer = await file.arrayBuffer();
                    var hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
                    var hashArray = Array.from(new Uint8Array(hashBuffer));
                    var hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                    log("SHA-256: " + hashHex);
                } catch (err) {
                    log("Error computing hash: " + err);
                }
            }
        });

        var Module = {
            preRun: [],
            postRun: [],
            print: function(text) {
                log("stdout: " + text);
            },
            printErr: function(text) {
                log("stderr: " + text);
            },
            onRuntimeInitialized: function() {
                log("Runtime initialized.");
                try {
                    // chdmain_version is exported via EMSCRIPTEN_KEEPALIVE, so it should be available as _chdmain_version
                    if (typeof Module._chdmain_version === 'function') {
                        var version = Module._chdmain_version();
                        log("chdmain_version returned: " + version);
                    } else {
                        log("Module._chdmain_version is not a function. Checking exports...");
                         // Sometimes it might not be directly on Module if not exported via command line but KEEPALIVE should work.
                         // Maybe it needs ccall or cwrap if not directly exposed, but usually _func works.
                         log("Keys in Module: " + Object.keys(Module).filter(k => k.indexOf('chdmain') !== -1));
                    }
                } catch(e) {
                    log("Error calling chdmain_version: " + e);
                }
            }
        };
    </script>
    <script src="chdmain.js"></script>
</body>
</html>
