    <h1>CHDMain Version Test</h1>
    <div>
        <label for="folderInput">Upload Folder:</label>
        <input type="file" id="folderInput" webkitdirectory directory multiple>
    </div>
    <br>
    <textarea id="log" rows="20" cols="100"></textarea>
    <script>
        var logElement = document.getElementById('log');
        function logE(text) {
            // log no endline
            logElement.value += text;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(text);
        }
        function log(text) {
            logE(text + "\n");
        }
        // window.addEventListener('load', function() {
        //     console.log('load');
        //     window.addEventListener('error', function(v) {
        //         log('ERROR: ' + v);
        //     });
        //     log('error hooked');
        // });

        async function shasumTest(file) {
                log("Computing SHA-256 for first file: " + (file.webkitRelativePath || file.name));
                try {
                    var arrayBuffer = await file.arrayBuffer();
                    var hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
                    var hashArray = Array.from(new Uint8Array(hashBuffer));
                    var hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                    log("SHA-256: " + hashHex);
                } catch (err) {
                    log("Error computing hash: " + err);
                }
        }

        async function initWasmFiles(files) {
            // js interface requires async load for filebuffer.
            // we eagerly load into object for compatibility.
            let wasm = [];
            log(`Found ${files.length} files.`);
            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                let path = file.webkitRelativePath || file.name;
                logE(`${i+1}/${files.length}: Reading ${path} ...`);
                let data = await file.arrayBuffer();
                log('Done');
                const size = data.byteLength;
                let wasmHeap = Module._malloc(size);
                Module.HEAPU8.set(data, wasmHeap);
                let view = new Uint8Array(data);
                for (let j = 0; j < 10; j++) {
                    log(`js f=${i}: ${j} = ${view[j]}`);
                }
                wasm[path] = {
                    ptr: wasmHeap,
                    size: data.byteLength,
                };
            }
            log('Finished listing files');
            window.files = wasm;
        }

        function wasmNumFiles() {
            let files = wasmGetFiles();
            return files.length;
        }
        function getFile(n) {
            let files = wasmGetFiles();
            if (n >= 0 && n < wasmNumFiles()) {
                return files[n].ptr;
            } else {
                return 0;
            }
        }
        function wasmFileBuffer(n) {
            // buffers are addresses allocated on the wasm heap.
            log('looking for: ' + n);
            return getFile(n).ptr;
        }
        function wasmFileSize(filename) {
            return getFile(n).size;
        }
        function wasmVersion() {
            return 123;
        }

        document.getElementById('folderInput').addEventListener('change', async function(e) {
            var files = e.target.files;
            log("Folder uploaded. Found " + files.length + " files.");
            await initWasmFiles(files);
            Module._chdWebEntry();
        });

        var Module = {
            preRun: [],
            postRun: [],
            print: function(text) {
                log("stdout: " + text);
            },
            printErr: function(text) {
                log("stderr: " + text);
            },
            onRuntimeInitialized: function() {
                log("Runtime initialized.");
                try {
                    // chdmain_version is exported via EMSCRIPTEN_KEEPALIVE, so it should be available as _chdmain_version
                    if (typeof Module._chdmain_version === 'function') {
                        var version = Module._chdmain_version();
                        log("chdmain_version returned: " + version);
                    } else {
                        log("Module._chdmain_version is not a function. Checking exports...");
                         log("Keys in Module: " + Object.keys(Module).filter(k => k.indexOf('chdmain') !== -1));
                    }
                } catch(e) {
                    log("Error calling chdmain_version: " + e);
                }
            }
        };
    </script>
